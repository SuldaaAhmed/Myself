# Single entry point in front of the site and the API.
# In production, terminate TLS here and forward on http.

upstream aurora_web {
    server web:3000;
    keepalive 32;
}

upstream aurora_api {
    server api:4000;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 12m;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # REST API and OpenAPI docs
    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://aurora_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Locally stored media
    location /uploads/ {
        proxy_pass http://aurora_api;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Immutable Next.js build assets
    location /_next/static/ {
        proxy_pass http://aurora_web;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://aurora_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
