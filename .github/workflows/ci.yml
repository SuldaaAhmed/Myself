name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  api:
    name: API — typecheck, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aurora
          POSTGRES_PASSWORD: aurora
          POSTGRES_DB: aurora_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aurora"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://aurora:aurora@localhost:5432/aurora_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-value-000000
      JWT_REFRESH_SECRET: ci-refresh-secret-value-00000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:push -w @aurora/api
      - run: npm run typecheck -w @aurora/api
      - run: npm run test -w @aurora/api
      - run: npm run build -w @aurora/api

  web:
    name: Web — typecheck, build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck -w @aurora/web
      # The site renders from the API; with none reachable it falls back to
      # empty state, which is exactly what this build proves.
      - run: npm run build -w @aurora/web

  portfolio:
    name: Portfolio — lint, typecheck, build
    runs-on: ubuntu-latest

    env:
      # NEXT_PUBLIC_API_URL is deliberately unset: with no API configured the
      # app serves its fixtures, and this build proves that path stays green.
      NEXT_PUBLIC_SITE_URL: http://localhost:3001
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint -w @aurora/portfolio
      - run: npm run typecheck -w @aurora/portfolio
      - run: npm run build -w @aurora/portfolio

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
