<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Favicon. Next's App Router picks `app/icon.svg` up by convention and emits
    the `<link rel="icon">` tag, so nothing has to be wired in `layout.tsx`.

    The mark is the ledger itself: three rows against a rail, with the top entry
    picked out in the amber accent — the same "one loud thing per view" rule the
    rest of the design follows, at 32px.
  -->
  <rect width="32" height="32" fill="#0B0E11" />
  <rect x="6" y="6" width="1.5" height="20" fill="#232B35" />
  <rect x="11" y="8" width="15" height="2" fill="#E8A33D" />
  <rect x="11" y="15" width="15" height="2" fill="#8A94A3" />
  <rect x="11" y="22" width="10" height="2" fill="#8A94A3" />
</svg>
